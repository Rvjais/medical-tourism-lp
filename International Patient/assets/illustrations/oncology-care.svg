  <circle cx="260" cy="210" r="170" fill="#f7efe2"/>
  <!-- doctor (left): head, coat body -->
  <circle cx="196" cy="160" r="34" fill="#10322e"/>
  <path d="M196 128a34 34 0 0 1 26 12 34 34 0 0 0-52 0 34 34 0 0 1 26-12z" fill="#082220"/>
  <path d="M150 268c0-34 20-58 46-58s46 24 46 58v22h-92z" fill="#0f6272"/>
  <path d="M196 210c-12 0-18 8-18 18v62h36v-62c0-10-6-18-18-18z" fill="#ffffff"/>
  <path d="M188 214h16v28a8 8 0 0 1-16 0z" fill="#e9724c"/>
  <!-- stethoscope -->
  <path d="M176 232c-12 10-14 26-6 38s24 16 36 8" stroke="#0e2a33" stroke-width="5" stroke-linecap="round"/>
  <circle cx="209" cy="282" r="9" fill="#f0b429"/>
  <!-- patient (right): armchair -->
  <circle cx="330" cy="182" r="30" fill="#7a4b32"/>
  <path d="M330 152a30 30 0 0 1 22 10 30 30 0 0 0-44 0 30 30 0 0 1 22-10z" fill="#683f28"/>
