  <!-- cross badge -->
  <circle cx="422" cy="140" r="34" fill="#f0b429"/>
  <path d="M416 128h12v8h8v12h-8v8h-12v-8h-8v-12h8z" fill="#ffffff"/>
  <!-- speech dots -->
  <circle cx="250" cy="106" r="5" fill="#e9724c"/>
  <circle cx="268" cy="96" r="4" fill="#0f6272"/>
  <circle cx="286" cy="108" r="3" fill="#f0b429"/>
