<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" fill="none" role="img" aria-label="Comfortable recovery care illustration">
  <!-- flat palette: cream circle, teal bed, coral heart, gold window -->
  <circle cx="260" cy="210" r="170" fill="#f7efe2"/>
  <!-- window -->
  <rect x="330" y="120" width="110" height="90" rx="12" fill="#0b4a57"/>
  <path d="M385 120v90M330 165h110" stroke="#f7efe2" stroke-width="6"/>
  <circle cx="356" cy="146" r="10" fill="#f0b429"/>
  <!-- bed -->
  <rect x="120" y="196" width="250" height="14" rx="7" fill="#0e2a33"/>
  <rect x="132" y="210" width="130" height="64" rx="10" fill="#0f6272"/>
  <rect x="132" y="210" width="130" height="34" rx="10" fill="#d9eef2"/>
  <!-- pillow -->
  <rect x="144" y="218" width="46" height="22" rx="10" fill="#ffffff"/>
  <!-- patient -->
  <path d="M198 236c22-18 58-18 74 0" stroke="#0e2a33" stroke-width="20" stroke-linecap="round"/>
  <circle cx="202" cy="236" r="14" fill="#7a4b32"/>
  <!-- bed legs -->
  <rect x="140" y="274" width="10" height="42" rx="5" fill="#0e2a33"/>
  <rect x="352" y="274" width="10" height="42" rx="5" fill="#0e2a33"/>
  <rect x="140" y="310" width="122" height="10" rx="5" fill="#0e2a33"/>
  <!-- heart monitor -->
  <circle cx="392" cy="266" r="30" fill="#e9724c"/>
  <path d="M380 266h8l5-9 8 16 5-7h8" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- plant -->
  <rect x="88" y="286" width="34" height="30" rx="8" fill="#c98f6b"/>
  <path d="M105 286c-4-22-18-30-18-30s20-4 24 16c3 12-6 14-6 14z" fill="#1f9d63"/>
  <path d="M105 280c8-16 22-18 22-18" stroke="#1f9d63" stroke-width="6" stroke-linecap="round"/>
</svg>
