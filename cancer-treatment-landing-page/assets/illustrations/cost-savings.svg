<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" fill="none" role="img" aria-label="Cost savings illustration">
  <!-- flat palette: ink #0e2a33 · cream #f7efe2 · coral #e9724c · gold #f0b429 · white -->
  <rect width="520" height="420" rx="24" fill="#10322e" opacity="0"/>
  <circle cx="260" cy="210" r="170" fill="#f7efe2"/>
  <!-- descending bars -->
  <rect x="110" y="150" width="52" height="180" rx="10" fill="#e9724c"/>
  <rect x="182" y="190" width="52" height="140" rx="10" fill="#f0b429"/>
  <rect x="254" y="230" width="52" height="100" rx="10" fill="#0f6272"/>
  <rect x="326" y="265" width="52" height="65" rx="10" fill="#0e2a33"/>
  <!-- down arrow -->
  <path d="M120 118c60 18 200 30 250 22" stroke="#0e2a33" stroke-width="7" stroke-linecap="round" stroke-dasharray="1 14"/>
  <path d="M358 108 394 124l-30 16z" fill="#0e2a33"/>
  <!-- coins -->
  <ellipse cx="404" cy="330" rx="52" ry="18" fill="#f0b429"/>
  <rect x="352" y="300" width="104" height="30" fill="#f0b429"/>
  <ellipse cx="404" cy="300" rx="52" ry="18" fill="#ffd469"/>
  <ellipse cx="404" cy="270" rx="52" ry="18" fill="#f0b429"/>
  <rect x="352" y="240" width="104" height="30" fill="#f0b429"/>
  <ellipse cx="404" cy="240" rx="52" ry="18" fill="#ffd469"/>
  <text x="404" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#7a4b06">$</text>
  <!-- percent badge -->
  <circle cx="120" cy="330" r="46" fill="#0e2a33"/>
  <text x="120" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#f7efe2">%</text>
  <!-- sparkle dots -->
  <circle cx="86" cy="120" r="6" fill="#e9724c"/>
  <circle cx="440" cy="140" r="6" fill="#f0b429"/>
</svg>
