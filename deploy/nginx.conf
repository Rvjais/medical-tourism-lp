# lp.shifarahealth.com — static landing pages
#
# The git checkout lives in the web root itself:
#   https://lp.shifarahealth.com/                       -> index.html (hub)
#   https://lp.shifarahealth.com/cancer-treatment/      -> cancer-treatment/index.html
#   https://lp.shifarahealth.com/international-patient/ -> international-patient/index.html
#
# Install instructions: ../DEPLOY.md

server {
    listen 80;
    listen [::]:80;

    server_name lp.shifarahealth.com;

    root /home/shifarahealth.com/public_html;
    index index.html;

    charset utf-8;

    # Add the trailing slash so each page's relative asset URLs resolve correctly.
    location ~ ^/(cancer-treatment|international-patient)$ {
        return 301 $scheme://$host$uri/$is_args$args;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # HTML: always revalidate, so a `git pull` shows up on the next visit.
    location ~* \.html$ {
        expires -1;
        try_files $uri =404;
    }

    # CSS/JS: short cache while the pages are still being iterated.
    location ~* \.(?:css|js)$ {
        expires 1h;
        try_files $uri =404;
    }

    # Images and fonts: longer cache.
    location ~* \.(?:jpg|jpeg|png|gif|svg|webp|avif|ico|woff2?)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # Repo internals that must never be reachable over HTTP.
    location ~ ^/(README\.md|DEPLOY\.md|\.gitignore)$ {
        deny all;
    }
    location ^~ /deploy/ {
        deny all;
    }
    location ^~ /docs/ {
        deny all;
    }

    # Allow ACME HTTP-01 challenges (certbot) before the dotfile deny rule.
    location ^~ /.well-known/acme-challenge/ {
        allow all;
    }

    # Never serve dotfiles (.git, .htaccess, ...).
    location ~ /\. {
        deny all;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    access_log /var/log/nginx/lp.shifarahealth.com.access.log;
    error_log  /var/log/nginx/lp.shifarahealth.com.error.log warn;
}
